name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regresion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regresión motor de cálculo + sintaxis de index.html
        run: node tests/regres.js
      - name: CSV intranet (candado + convención padres compuestos)
        run: node tests/csv_intranet.js
      - name: Transcripción determinista (4 modos de fallo IA)
        run: node tests/transcripcio.js
      - name: Guardián isNoSuma (la regla «no suma» idéntica en pantalla, Excel y PDF)
        run: node tests/isnosuma_coherent.js
      - name: Detector de decisiones al firmar (aprendizaje v2)
        run: node tests/decisiones.js
      - name: Guardián es-ES números/totales (auditoría 19/07 · amid/preu es-ES + total sin miles)
        run: node tests/esES_numeros_totals.js
      - name: Guardián mensajes honestos + guardias de reentrada (consejo 19/07)
        run: node tests/consejo_19jul_fixes.js
      - name: Guardián red de seguridad anti-precios-envenenados (parseNum es-ES + total disparado)
        run: node tests/xarxa_seguretat.js
      - name: Guardián correcciones de la técnica 21/07 (subtotal 0 € + la decisión del técnico manda)
        run: node tests/peticions_21jul.js
      - name: Guardián B11 (el % se cuenta con la opción A/B más cara, nunca con la suma)
        run: node tests/b11_pct_opcions.js
      - name: Guardián de recuperación de contraseña (no revela quién tiene acceso · fuerza cambiarla)
        run: node tests/recuperar_contrasenya.js
      - name: Guardián total de sección por opción A/B + precios vinculados
        run: node tests/seccio_ab_i_preus_lligats.js
      - name: Dependencias de la paridad (exceljs+jszip)
        run: npm install --no-package-lock --no-save exceljs jszip
      - name: Paridad de ficheros reales (Excel/PDF impresos = pantalla)
        run: node tests/paritat.js
      - name: Guardián del candado de paridad (funciones reales del HTML)
        run: node tests/paritat_candau.js
      - name: Guardián del libro de decisiones del aprendizaje (quién aprueba o para cada regla, y cuándo)
        run: node tests/registre_decisions.js
      - name: Guardián editor LOT 1 (los 4 puntos de la tècnica del 20/07)
        run: node tests/editor_lot1.js
      - name: Guardián partir partida con varias medidas/unidades
        run: node tests/partir_mesures.js
      - name: Guardián imprevistos/reserva exentos de coeficiente
        run: node tests/sensecoef_coherent.js
      - name: Guardián historial de versiones + restaurar (#86)
        run: node tests/versions.js
      - name: Guardián reconciliación por capítulos
        run: node tests/reconciliacio.js
      - name: Guardián de avisos honestos (el candado avisa de verdad, no miente)
        run: node tests/avisos_honestos.js
      - name: Guardián coeficiente de reserva (no pinta 1,485 como si fuera bueno)
        run: node tests/coef_reserva.js
      - name: Guardián de persistencia de la edición manual (reabrir NO borra desglossos)
        run: node tests/persist_edicio_manual.js
      - name: Guardián del comparador de lecciones (antes → después por partida, no solo el nombre)
        run: node tests/comparador_exemples.js
      - name: Guardián de la cabecera fija de la tabla (sigue la barra real, no tapa la 1a fila)
        run: node tests/capcalera_fixa.js
      - name: Guardián del lector BC3 (partidas reales, no la mano de obra interna)
        run: node tests/bc3_partides.js
      - name: Guardián de la lectura de PDF (capítulos por posición+tamaño, no texto aplanado)
        run: node tests/pdf_capitols.js
      - name: Guardián de la captura exhaustiva del criterio (opcional/alternativa/texto/medición + sin tope de 3)
        run: node tests/criteri_exhaustiu.js
      - name: Guardián de títulos en mayúsculas por defecto (convención GTA)
        run: node tests/titols_majuscules.js
      - name: Guardián del desglose de medición por zona (BC3 ~M · dónde se actúa)
        run: node tests/amidament_desglos.js
      - name: Guardián del desglose de medición desde texto (PDF/Excel · dónde se actúa, sin atribuir mal)
        run: node tests/desglos_pdf.js
      - name: Guardián de legibilidad del panel de aprendizaje (sin jerga para la tècnica)
        run: node tests/panel_llegible.js
      - name: Guardián de salida guardada + anti-pestaña-zombi (pérdida de trabajo)
        run: node tests/sortida_i_zombie.js
      - name: Guardián de la primera fila visible (cabecera sticky bien anclada)
        run: node tests/primera_fila_sticky.js
      - name: Guardián de exportadores sin 0,00 € inventado (PDF y Excel)
        run: node tests/export_sense_zero.js
      - name: Guardián del borrado de borradores propios (equipo técnico)
        run: node tests/esborrar_esborranys.js
      - name: Guardián del extractor a prueba de JSJ (escaneados, anclas CYPE, cuerpos, sin fusiones)
        run: node tests/transcripcio_jsj.js
      - name: Guardián de las funcionales de la tècnica (nº capítulos, vincular, industriales, ejemplos)
        run: node tests/funcionals_tecnica.js
      - name: Guardián del bucle de aprendizaje (el criterio sin explicar no muere en silencio)
        run: node tests/bucle_aprenentatge.js

      - name: Guardián de los SUBTOTALES de capítulo dentro del fichero entregado
        run: node tests/paritat_subtotals.js
      - name: Guardián del interruptor de numeración «1.1» del CSV de la intranet (los 2 modos)
        run: node tests/csv_cap_decimal.js
      - name: Guardián del módulo Carta y Fotos (carta, hoja de fotos, cabecera sin pisar el logo)
        run: node tests/carta_fotos.js
      - name: Dependencias del OCR (tesseract.js + pngjs)
        run: npm install --no-package-lock --no-save tesseract.js pngjs exceljs jszip   # 22/10 LOT 32b: npm treu exceljs si no es torna a posar aquí (el guardià LOT 25 va petar a la CI)
      - name: Guardián del OCR de escaneados — escaneo limpio y escaneo maltratado
        run: node tests/ocr_escanejat.js
      - name: Guardián de la política de contraseñas (mínimo 10, también cuando las pone un admin)
        run: node tests/contrasenyes_fortes.js
      - name: Guardián del rastro de exportaciones (ningún documento sale sin quedar anotado)
        run: node tests/rastre_exportacions.js
      - name: Guardián de las descripciones de los ficheros de medición (título Y descripción, nunca solo el título)
        run: node tests/bc3_descripcions.js
      - name: Guardián del precio dudoso y de los saltos del buscador de precios (nada se salta en silencio)
        run: node tests/preu_dubtos_i_salts.js
      - name: Guardián de la entrega de documentos (ninguna pestaña en blanco y muda)
        run: node tests/entrega_documents.js
      - name: Guardián de las imágenes incrustadas (logo y sello íntegros — si no, ningún PDF sale)
        run: node tests/imatges_integres.js
      - name: Guardián del criterio del técnico (el programa no pide validaciones ni añade reglas)
        run: node tests/criteri_del_tecnic.js
      - name: Guardián de que nada se sale del folio ni sale un aviso nuestro en el documento del cliente
        run: node tests/pdf_cap_a_fora.js
      - name: Guardián de las partidas del catálogo sin precio (decir que SÍ son suyas, no decir que no existen)
        run: node tests/cataleg_sense_preu.js
      - name: "Guardián · capítol del document i NO SUMA (LOT 23)"
        run: node tests/capitol_document_i_no_suma_lot23.js
      - name: "Guardián · partida al capítol del seu text (LOT 26)"
        run: node tests/capitol_pel_text_lot26.js
      - name: "Guardián · convencions dels seus pressupostos (LOT 24)"
        run: node tests/convencions_gta_lot24.js
      - name: "Guardián · estructura llegida pel contingut (LOT 30)"
        run: node tests/lectura_per_contingut_lot30.js
      - name: "Guardián · errors callats i costums (LOT 25)"
        run: node tests/lot25_callats_i_costums.js
      - name: "Guardián · opcions, notes i peus (LOT 22)"
        run: node tests/opcions_notes_peus_fantasmes_lot22.js
      - name: "Guardián · partida sense codi ajuntada (LOT 29)"
        run: node tests/partida_sense_codi_ajuntada_lot29.js
      - name: "Guardián · arreglos de la revisió total · cap error callat nou (LOT 32)"
        run: node tests/revisio_total_lot32.js
      - name: "Guardián · numeración de las partidas por el código del documento (LOT 31)"
        run: node tests/numeracio_document_lot31.js
      - name: "Guardián · dos contadores (lectura y precios) y los avisos de lectura primero (LOT 33)"
        run: node tests/dos_comptadors_lot33.js
      - name: "Guardián · líneas de medición en el texto de la partida, como en vuestros presupuestos a mano (LOT 34)"
        run: node tests/linies_mesura_al_text_lot34.js
      - name: "Guardián · la línea de medición con etiqueta cierra la partida y el código corto abre otra (LOT 35)"
        run: node tests/mesura_amb_etiqueta_lot35.js
      - name: "Guardián · el texto de la partida se queda entero: la última línea con la cantidad al final y el título hasta el punto (LOT 36)"
        run: node tests/text_sencer_lot36.js
      - name: "Guardián · ninguna nota del documento ni final de frase se pierde sin aviso, y la zona es el nombre que el documento escribe en cada hoja (LOT 37)"
        run: node tests/notes_i_frases_lot37.js
      - name: "Guardián · ninguna cifra con unidad dentro de una frase corta el texto, códigos con minúsculas, PA con cantidad del documento y listado repetido escrito distinto (LOT 38)"
        run: node tests/capes_nostres_lot38.js
      - name: "Guardián · la cantidad contra la línea que cierra la partida y los capítulos del mismo nivel al mismo nivel (LOT 39)"
        run: node tests/quantitats_i_nivells_lot39.js
      - name: "Guardián · listado repetido con la zona en una sola copia o tres listados, sin capítulos vacíos de más, y PA con la cantidad marcada del documento (LOT 40)"
        run: node tests/llistat_repetit_lot40.js
      - name: "Guardián · filas que son una línea de medición, precio en letras cortado y capítulo repetido en la página siguiente (LOT 41)"
        run: node tests/trossos_i_preus_lot41.js
      - name: "Guardián · títulos de sección o de página del documento que salían como capítulo (LOT 42)"
        run: node tests/capitols_seccio_lot42.js
      - name: "Guardián · el capítulo que continúa en el corte entre dos trozos y el capítulo vacío con partidas en el documento (LOT 45)"
        run: node tests/tall_capitol_lot45.js
